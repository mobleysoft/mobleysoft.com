<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirmGrouper - Venture Group Organizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #04040a;
            color: #f0ead6;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #c9a227;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9ba7aa;
            font-size: 12px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .group {
            background: #0f0f1a;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 20px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .group-header {
            font-size: 14px;
            font-weight: bold;
            color: #c9a227;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a3a;
        }

        .group-count {
            font-size: 11px;
            color: #9ba7aa;
            margin-top: 5px;
        }

        .drop-zone {
            flex: 1;
            background: rgba(41, 128, 185, 0.05);
            border: 2px dashed #2a4a5a;
            border-radius: 6px;
            padding: 10px;
            min-height: 400px;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            background: rgba(41, 128, 185, 0.15);
            border-color: #4a90e2;
        }

        .venture {
            background: #1a1a2e;
            border: 1px solid #2a3a4a;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: move;
            font-size: 12px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .venture:hover {
            background: #2a2a3e;
            border-color: #4a6a8a;
            transform: translateX(2px);
        }

        .venture.dragging {
            opacity: 0.5;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            background: #c9a227;
            color: #04040a;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #e0b73f;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .output-section {
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .output-header {
            font-size: 14px;
            font-weight: bold;
            color: #c9a227;
            margin-bottom: 15px;
        }

        .output-container {
            background: #0f0f1a;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 20px;
        }

        .output-text {
            background: #1a1a2e;
            border: 1px solid #2a3a4a;
            border-radius: 4px;
            padding: 15px;
            font-size: 11px;
            line-height: 1.6;
            color: #f0ead6;
            max-height: 300px;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 15px;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .copy-all-btn {
            width: 100%;
            background: #c9a227;
            color: #04040a;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-all-btn:hover {
            background: #e0b73f;
        }

        .copy-feedback {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: rgba(201, 162, 39, 0.2);
            border: 1px solid #c9a227;
            border-radius: 4px;
            font-size: 11px;
            color: #c9a227;
            text-align: center;
        }

        .copy-feedback.show {
            display: block;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎯 FirmGrouper</h1>
        <p class="subtitle">Drag-and-drop venture group organizer | Drag ventures between groups, then copy the output</p>
    </header>

    <div class="container">
        <div class="group">
            <div class="group-header">
                GROUP 1: PRIORITY
                <div class="group-count" id="count1">41 ventures</div>
            </div>
            <div class="drop-zone" id="group1" data-group="1"></div>
            <div class="controls">
                <button onclick="copyGroup(1)">📋 Copy</button>
            </div>
        </div>

        <div class="group">
            <div class="group-header">
                GROUP 2: STANDARD
                <div class="group-count" id="count2">41 ventures</div>
            </div>
            <div class="drop-zone" id="group2" data-group="2"></div>
            <div class="controls">
                <button onclick="copyGroup(2)">📋 Copy</button>
            </div>
        </div>

        <div class="group">
            <div class="group-header">
                GROUP 3: INCUBATOR
                <div class="group-count" id="count3">41 ventures</div>
            </div>
            <div class="drop-zone" id="group3" data-group="3"></div>
            <div class="controls">
                <button onclick="copyGroup(3)">📋 Copy</button>
            </div>
        </div>
    </div>

    <div class="output-section">
        <div class="output-header">📤 Output (Auto-updating)</div>
        <div class="output-container">
            <div class="output-text" id="output"></div>
            <button class="copy-all-btn" onclick="copyAllOutput()">📋 Copy All Output</button>
            <div class="copy-feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        // Initial data
        const initialData = {
            group1: ["mobcorp.cc", "mobleyhelms.com", "weylandai.com", "abstergo.cc", "americanagi.cc", "literacraft.com", "americnagi.cc", "anattar.com", "agentzaar.com", "authfor.com", "agentropi.com", "bloomagi.cc", "draknir.com", "instantiability.com", "devtoolai.com", "agewinder.com", "conseiv.com", "alhena.cc", "accountdrac.com", "areshiva.com", "cryptosmart.cc", "aiopencommerce.com", "consenta.cc", "aicossic.com", "devducky.com", "bitdoggo.com", "audiovizai.com", "animetrope.com", "brynhildai.com", "domainwombat.com", "bignice.cc", "dofura.com", "bookeepr.cc", "bookclubs.cc", "book2film.cc", "devtoolbx.com", "draugr.cc", "bondwright.com", "mobleybooks.com", "ownschool.cc", "vendyai.com"],
            group2: ["emissionhub.cc", "enablinghomes.com", "encoverai.com", "danzoa.com", "entoolize.com", "equifiant.com", "extraterran.com", "fedbank.cc", "fedtalent.cc", "femptocom.com", "filmline.cc", "firmcreate.com", "fundyai.com", "fystz.com", "golfcad.cc", "golfdad.cc", "golflink.cc", "golfmind.cc", "galadul.com", "gamegob.com", "glcx.cc", "glyphyai.com", "gravnova.com", "greenhandcapital.com", "greybeardai.com", "gurukle.com", "halside.com", "healspell.com", "helmcorp.cc", "helmdir.com", "helmscorp.cc", "hildrai.com", "industrize.com", "intfer.cc", "kubaki.cc", "lawyik.com", "leadersclub.cc", "legibleweights.com", "legionicai.com", "lovemaint.com", "mailguyai.com"],
            group3: ["ecofixai.com", "malathor.com", "marketingium.com", "meeva.io", "mobcoin.cc", "mobleymetal.com", "mobleysoft.com", "newgameplus.cc", "pandorachat.cc", "patentkin.com", "powerhost.cc", "quanticfork.com", "reasontodate.com", "rebrief.me", "recovai.com", "roncorp.cc", "ronhelms.cc", "salesfactorai.com", "sanctuaryui.com", "scalarflux.com", "selfcoin.cc", "sentiantai.com", "paintedwhore.cc", "singularityui.com", "syncropy.com", "talkingmind.cc", "taskgridai.com", "tenancyai.com", "traceformer.com", "transcendantai.com", "valdring.com", "valkrai.com", "ventraleye.com", "warpdrive.cc", "watchforce.cc", "workshrinker.com", "youthmend.com", "yutaniai.com", "mobleyreport.com", "brocade.cc", "twill.finance"]
        };

        let draggedElement = null;

        function initGroups() {
            for (let i = 1; i <= 3; i++) {
                const groupKey = `group${i}`;
                const dropZone = document.getElementById(`group${i}`);
                initialData[groupKey].forEach(venture => {
                    const div = document.createElement('div');
                    div.className = 'venture';
                    div.textContent = venture;
                    div.draggable = true;
                    div.addEventListener('dragstart', startDrag);
                    div.addEventListener('dragend', endDrag);
                    dropZone.appendChild(div);
                });
            }
            updateCounts();
            updateOutput();
        }

        function startDrag(e) {
            draggedElement = this;
            this.classList.add('dragging');
        }

        function endDrag(e) {
            draggedElement.classList.remove('dragging');
            draggedElement = null;
        }

        function setupDropZones() {
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    if (draggedElement) {
                        zone.appendChild(draggedElement);
                        updateCounts();
                        updateOutput();
                    }
                });
            });
        }

        function updateCounts() {
            for (let i = 1; i <= 3; i++) {
                const count = document.getElementById(`group${i}`).children.length;
                document.getElementById(`count${i}`).textContent = `${count} ventures`;
            }
        }

        function updateOutput() {
            let output = '';
            for (let i = 1; i <= 3; i++) {
                const groupName = ['', 'GROUP 1', 'GROUP 2', 'GROUP 3'][i];
                const ventures = Array.from(document.getElementById(`group${i}`).children)
                    .map(el => el.textContent)
                    .join(', ');
                output += `${groupName}:\n${ventures}\n\n`;
            }
            document.getElementById('output').textContent = output;
        }

        function copyGroup(groupNum) {
            const ventures = Array.from(document.getElementById(`group${groupNum}`).children)
                .map(el => el.textContent)
                .join(', ');
            navigator.clipboard.writeText(ventures);
            showFeedback(`GROUP ${groupNum} copied!`);
        }

        function copyAllOutput() {
            const output = document.getElementById('output').textContent;
            navigator.clipboard.writeText(output);
            showFeedback('All output copied!');
        }

        function showFeedback(message) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.classList.add('show');
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 2000);
        }

        // Initialize
        initGroups();
        setupDropZones();
    </script>
</body>
</html>
