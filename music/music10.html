<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Mobius Music Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: monospace;
    }
    body {
      background: #111;
      color: #0fc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      min-height: 100vh;
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      z-index: -1;
      opacity: 0.8;
    }
    #ui {
      position: relative;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #0fc;
      text-align: center;
      margin: 20px 0;
      text-shadow: 0 0 10px #0fc;
    }
    button {
      background: #0a0a0a;
      color: #0fc;
      border: 1px solid #0fc;
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
      box-shadow: 0 0 5px #0fc;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: #0fc;
      color: #000;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #controls {
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.7);
      border: 1px solid #0fc;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,255,200,0.3);
    }
    #progress {
      width: 100%;
      height: 20px;
      background: #000;
      margin: 10px 0;
      box-shadow: 0 0 5px #0fc inset;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #0fc;
      transition: width 0.3s;
    }
    .slider-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }
    input[type=range] {
      width: 100%;
      margin: 10px 0;
    }
    input[type=text] {
      background: #000;
      border: 1px solid #0fc;
      color: #0fc;
      padding: 10px;
      width: 100%;
      margin-bottom: 15px;
      font-size: 16px;
    }
    #log {
      color: #0fc;
      height: 120px;
      overflow-y: auto;
      border: 1px solid #0fc;
      padding: 10px;
      margin-top: 10px;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
    }
    #log div {
      border-bottom: 1px solid #050;
      padding: 4px 0;
    }
    .buttons {
      display: flex;
      justify-content: center;
      margin: 15px 0;
    }
    #permission-notice {
      color: #0fc;
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
      padding: 10px;
      background: rgba(0, 255, 200, 0.1);
      border: 1px dashed #0fc;
    }
    #instruments {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 15px;
      background: rgba(0,0,0,0.4);
      padding: 10px;
      border: 1px solid #077;
    }
    .instrument {
      display: inline-block;
      padding: 5px 8px;
      margin: 3px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #0fc;
      font-size: 12px;
    }
    .instrument.active {
      background: rgba(0,255,200,0.2);
    }
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      flex-direction: column;
      color: #0fc;
      display: none;
    }
    #loading.active {
      display: flex;
    }
    .spinner {
      border: 5px solid #111;
      border-top: 5px solid #0fc;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 600px) {
      .slider-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <canvas id="visualizer"></canvas>
  <div id="ui">
    <h1>Quantum Mobius Music Generator</h1>
    <div id="controls">
      <input type="text" id="seed" value="Quantum Symphony" placeholder="Enter a seed phrase...">
      
      <div class="slider-group">
        <div>
          <label for="dimensions">Mobius Dimensions: <span id="dimensions-value">24</span></label>
          <input type="range" id="dimensions" min="16" max="32" value="24">
        </div>
        <div>
          <label for="twist">Twist Factor: <span id="twist-value">0.75</span></label>
          <input type="range" id="twist" min="0.1" max="2.0" step="0.05" value="0.75">
        </div>
        <div>
          <label for="quantum">Quantum States: <span id="quantum-value">16</span></label>
          <input type="range" id="quantum" min="8" max="24" value="16">
        </div>
        <div>
          <label for="evolution">Evolution Steps: <span id="evolution-value">8</span></label>
          <input type="range" id="evolution" min="2" max="12" value="8">
        </div>
        <div>
          <label for="complexity">Song Complexity: <span id="complexity-value">7</span></label>
          <input type="range" id="complexity" min="3" max="10" value="7">
        </div>
        <div>
          <label for="duration">Song Duration: <span id="duration-value">30</span>s</label>
          <input type="range" id="duration" min="15" max="60" step="5" value="30">
        </div>
      </div>
      
      <div id="instruments">
        <div class="instrument active" data-instrument="bass">Bass</div>
        <div class="instrument active" data-instrument="pads">Pads</div>
        <div class="instrument active" data-instrument="lead">Lead</div>
        <div class="instrument active" data-instrument="pluck">Pluck</div>
        <div class="instrument active" data-instrument="percussion">Percussion</div>
      </div>
      
      <div id="permission-notice">
        Click Generate then Play to enable audio
      </div>
      
      <div class="buttons">
        <button id="generate">Generate Music</button>
        <button id="play" disabled>Play</button>
        <button id="stop" disabled>Stop</button>
      </div>
      
      <div id="progress"><div id="progress-bar"></div></div>
    </div>
    
    <div id="log"></div>
  </div>
  
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Generating quantum music...</div>
  </div>

<script>
(function() {
  // Constants and utilities
  const PI = Math.PI;
  const TAU = PI * 2;
  
  // DOM elements
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  const logEl = document.getElementById('log');
  const seedEl = document.getElementById('seed');
  const genBtn = document.getElementById('generate');
  const playBtn = document.getElementById('play');
  const stopBtn = document.getElementById('stop');
  const progressBar = document.getElementById('progress-bar');
  const loadingEl = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');
  
  // Instrument toggles
  const instrumentElements = document.querySelectorAll('.instrument');
  const activeInstruments = {
    bass: true,
    pads: true,
    lead: true,
    pluck: true,
    percussion: true
  };
  
  // Set up instrument toggle
  instrumentElements.forEach(el => {
    el.addEventListener('click', () => {
      const instrument = el.getAttribute('data-instrument');
      if (el.classList.contains('active')) {
        el.classList.remove('active');
        activeInstruments[instrument] = false;
      } else {
        el.classList.add('active');
        activeInstruments[instrument] = true;
      }
    });
  });
  
  // Sliders
  const dimensionsSlider = document.getElementById('dimensions');
  const dimensionsValue = document.getElementById('dimensions-value');
  const twistSlider = document.getElementById('twist');
  const twistValue = document.getElementById('twist-value');
  const quantumSlider = document.getElementById('quantum');
  const quantumValue = document.getElementById('quantum-value');
  const evolutionSlider = document.getElementById('evolution');
  const evolutionValue = document.getElementById('evolution-value');
  const complexitySlider = document.getElementById('complexity');
  const complexityValue = document.getElementById('complexity-value');
  const durationSlider = document.getElementById('duration');
  const durationValue = document.getElementById('duration-value');
  
  // Initialize audio context
  let audioCtx;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    log('AudioContext not supported in this browser');
  }
  
  // State
  let isPlaying = false;
  let isGenerating = false;
  let lineCount = 0;
  let audioBuffer = null;
  let startTime = 0;
  let audioNodes = {
    source: null,
    gain: null
  };
  
  // Musical information
  let songData = {
    duration: 30,
    bpm: 120,
    instruments: {},
    sections: [],
    currentTime: 0
  };
  
  // Canvas setup
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  
  // Update slider displays
  function updateSliders() {
    dimensionsValue.textContent = dimensionsSlider.value;
    twistValue.textContent = twistSlider.value;
    quantumValue.textContent = quantumSlider.value;
    evolutionValue.textContent = evolutionSlider.value;
    complexityValue.textContent = complexitySlider.value;
    durationValue.textContent = durationSlider.value;
  }
  
  // Attach events to sliders
  [dimensionsSlider, twistSlider, quantumSlider, evolutionSlider, complexitySlider, durationSlider].forEach(slider => {
    slider.addEventListener('input', updateSliders);
  });
  
  // Initial update
  updateSliders();
  
  // Logging function
  function log(msg) {
    const line = document.createElement('div');
    line.textContent = `${++lineCount}: ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  
  // Seed-based random number generator
  function createRNG(seed) {
    let s = hashCode(seed);
    return function() {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }
  
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash = hash & hash;
    }
    return Math.abs(hash);
  }

  // Simple music generators for different instruments
  function generateSimpleEvents(type, bars, seed) {
    const seedRNG = createRNG(seed + type);
    const events = [];
    const secondsPerBar = 4 * (60 / 120); // Simple 120 BPM
    
    // Basic parameters
    const intensity = 0.4 + seedRNG() * 0.6;
    const density = 0.3 + seedRNG() * 0.7;
    
    // Add some basic events
    if (activeInstruments.bass) {
      // Simple bass line
      for (let bar = 0; bar < bars; bar++) {
        const note = 36 + Math.floor(seedRNG() * 12); // C2 to C3
        events.push({
          instrument: 'bass',
          note: note,
          time: bar * secondsPerBar,
          duration: secondsPerBar * 0.8,
          velocity: 0.7 * intensity
        });
      }
    }
    
    if (activeInstruments.pads) {
      // Simple pads
      for (let bar = 0; bar < bars; bar += 2) {
        const note = 48 + Math.floor(seedRNG() * 24); // C3 to C5
        events.push({
          instrument: 'pads',
          note: note,
          time: bar * secondsPerBar,
          duration: secondsPerBar * 2,
          velocity: 0.5 * intensity
        });
      }
    }
    
    if (activeInstruments.lead) {
      // Simple lead melody
      for (let bar = 0; bar < bars; bar++) {
        if (seedRNG() < density) {
          const note = 60 + Math.floor(seedRNG() * 24); // C4 to C6
          events.push({
            instrument: 'lead',
            note: note,
            time: bar * secondsPerBar + seedRNG() * secondsPerBar,
            duration: 0.2 + seedRNG() * 0.5,
            velocity: 0.6 * intensity
          });
        }
      }
    }
    
    if (activeInstruments.pluck) {
      // Simple plucks
      for (let bar = 0; bar < bars; bar++) {
        for (let beat = 0; beat < 4; beat++) {
          if (seedRNG() < density * 0.5) {
            const note = 72 + Math.floor(seedRNG() * 12); // C5 to C6
            events.push({
              instrument: 'pluck',
              note: note,
              time: bar * secondsPerBar + beat * (60/120),
              duration: 0.1 + seedRNG() * 0.2,
              velocity: 0.4 * intensity
            });
          }
        }
      }
    }
    
    if (activeInstruments.percussion) {
      // Simple percussion
      for (let bar = 0; bar < bars; bar++) {
        // Kick on beat 1
        events.push({
          instrument: 'percussion',
          note: 36, // Kick
          time: bar * secondsPerBar,
          duration: 0.1,
          velocity: 0.8 * intensity
        });
        
        // Snare on beats 2 and 4
        events.push({
          instrument: 'percussion',
          note: 38, // Snare
          time: bar * secondsPerBar + 1 * (60/120),
          duration: 0.1,
          velocity: 0.6 * intensity
        });
        events.push({
          instrument: 'percussion',
          note: 38, // Snare
          time: bar * secondsPerBar + 3 * (60/120),
          duration: 0.1,
          velocity: 0.6 * intensity
        });
        
        // Hi-hats
        for (let eighth = 0; eighth < 8; eighth++) {
          if (seedRNG() < 0.8) {
            events.push({
              instrument: 'percussion',
              note: 42, // Hi-hat
              time: bar * secondsPerBar + eighth * 0.5 * (60/120),
              duration: 0.05,
              velocity: 0.4 * intensity
            });
          }
        }
      }
    }
    
    return events;
  }
  
  // Generate a section of a song (simplified version)
  function generateSection(type, seed, scale, chords, duration, bpm) {
    try {
      const seedRNG = createRNG(seed + type);
      const sectionDuration = duration;
      const beatsPerBar = 4;
      const secondsPerBeat = 60 / bpm;
      const totalBeats = sectionDuration / secondsPerBeat;
      const totalBars = Math.floor(totalBeats / beatsPerBar);
      
      // Generate simple events
      const events = generateSimpleEvents(type, totalBars, seed);
      
      return {
        type,
        duration: sectionDuration,
        events: events
      };
    } catch (err) {
      log(`Error in generateSection (${type}): ${err.message}`);
      // Return a valid object with an empty events array
      return {
        type,
        duration,
        events: []
      };
    }
  }
  
  // Create song structure (simplified)
  function generateSongStructure(seed, duration, complexity) {
    try {
      const seedRNG = createRNG(seed + 'structure');
      
      // Determine BPM based on seed
      const bpm = 90 + Math.floor(seedRNG() * 40); // 90-130 BPM
      
      // Placeholder for musical scale and chords
      const scale = [];
      const chords = [];
      
      // Structure based on complexity
      let sections = [];
      const totalBars = Math.floor(duration / (4 * 60 / bpm)); // convert to bars
      
      // Allocation percentages (simplified)
      const allocation = {
        intro: 0.15,
        verse: 0.25,
        chorus: 0.3,
        bridge: 0.15,
        outro: 0.15
      };
      
      // Calculate bars for each section
      const introBars = Math.max(4, Math.floor(totalBars * allocation.intro));
      const verseBars = Math.max(8, Math.floor(totalBars * allocation.verse));
      const chorusBars = Math.max(8, Math.floor(totalBars * allocation.chorus));
      const bridgeBars = Math.max(4, Math.floor(totalBars * allocation.bridge));
      const outroBars = Math.max(4, Math.floor(totalBars * allocation.outro));
      
      // Create section objects
      const introSection = {
        type: 'intro',
        bars: introBars,
        duration: introBars * 4 * (60 / bpm)
      };
      
      const verseSection = {
        type: 'verse',
        bars: verseBars,
        duration: verseBars * 4 * (60 / bpm)
      };
      
      const chorusSection = {
        type: 'chorus',
        bars: chorusBars,
        duration: chorusBars * 4 * (60 / bpm)
      };
      
      const bridgeSection = {
        type: 'bridge',
        bars: bridgeBars,
        duration: bridgeBars * 4 * (60 / bpm)
      };
      
      const outroSection = {
        type: 'outro',
        bars: outroBars,
        duration: outroBars * 4 * (60 / bpm)
      };
      
      // Build song structure
      sections = [
        introSection,
        verseSection,
        chorusSection,
        bridgeSection,
        outroSection
      ];
      
      // Render section events
      let currentTime = 0;
      for (let i = 0; i < sections.length; i++) {
        const section = sections[i];
        section.startTime = currentTime;
        
        // Generate events for each section
        const sectionData = generateSection(
          section.type, 
          seed + section.type, 
          scale, 
          chords, 
          section.duration, 
          bpm
        );
        
        // Ensure events is always an array
        section.events = Array.isArray(sectionData.events) ? sectionData.events : [];
        
        currentTime += section.duration;
      }
      
      return {
        bpm,
        scale,
        chords,
        duration: currentTime, // Actual total duration
        sections
      };
    } catch (err) {
      log(`Error in generateSongStructure: ${err.message}`);
      // Return a minimal valid structure
      return {
        bpm: 120,
        scale: [],
        chords: [],
        duration: duration,
        sections: []
      };
    }
  }
  
  // Synthesize bass sound
  function createBassSynth(attack = 0.01, decay = 0.2, sustain = 0.3, release = 0.4) {
    return function(time, note, duration, velocity) {
      const osc = audioCtx.createOscillator();
      const gainEnv = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      
      // Convert MIDI note to frequency
      const freq = 440 * Math.pow(2, (note - 69) / 12);
      
      // Configure oscillator
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      
      // Configure filter
      filter.type = 'lowpass';
      filter.frequency.value = 500; // Heavy filtering for bass
      filter.Q.value = 2;
      
      // Configure envelope
      gainEnv.gain.value = 0;
      
      // ADSR envelope
      const now = audioCtx.currentTime;
      gainEnv.gain.setValueAtTime(0, now + time);
      gainEnv.gain.linearRampToValueAtTime(velocity, now + time + attack);
      gainEnv.gain.linearRampToValueAtTime(velocity * sustain, now + time + attack + decay);
      gainEnv.gain.linearRampToValueAtTime(0, now + time + duration + release);
      
      // Sub-oscillator for extra bass
      const subOsc = audioCtx.createOscillator();
      subOsc.type = 'sine';
      subOsc.frequency.value = freq / 2; // One octave below
      
      const subGain = audioCtx.createGain();
      subGain.gain.value = velocity * 0.5;
      
      // Connect everything
      osc.connect(filter);
      subOsc.connect(subGain);
      subGain.connect(filter);
      filter.connect(gainEnv);
      gainEnv.connect(audioNodes.gain);
      
      // Start and stop
      osc.start(now + time);
      osc.stop(now + time + duration + release);
      
      subOsc.start(now + time);
      subOsc.stop(now + time + duration + release);
      
      return {
        oscillators: [osc, subOsc],
        gains: [gainEnv, subGain]
      };
    };
  }
  
  // Synthesize pad sound
  function createPadSynth(attack = 0.5, decay = 0.5, sustain = 0.8, release = 1.0) {
    return function(time, note, duration, velocity) {
      const voices = [];
      const gainEnv = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      
      // Convert MIDI note to frequency
      const freq = 440 * Math.pow(2, (note - 69) / 12);
      
      // Create detuned voices for chorus effect
      const detuneAmounts = [-10, -5, 0, 5, 10]; // cents
      
      detuneAmounts.forEach(detune => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.detune.value = detune;
        voices.push(osc);
      });
      
      // Configure filter
      filter.type = 'lowpass';
      filter.frequency.value = 1500;
      filter.Q.value = 1;
      
      // Configure envelope
      gainEnv.gain.value = 0;
      
      // ADSR envelope
      const now = audioCtx.currentTime;
      gainEnv.gain.setValueAtTime(0, now + time);
      gainEnv.gain.linearRampToValueAtTime(velocity * 0.8, now + time + attack);
      gainEnv.gain.linearRampToValueAtTime(velocity * sustain * 0.8, now + time + attack + decay);
      gainEnv.gain.linearRampToValueAtTime(0, now + time + duration + release);
      
      // Connect everything
      voices.forEach(osc => osc.connect(filter));
      filter.connect(gainEnv);
      gainEnv.connect(audioNodes.gain);
      
      // Start and stop
      voices.forEach(osc => {
        osc.start(now + time);
        osc.stop(now + time + duration + release);
      });
      
      return {
        oscillators: voices,
        gains: [gainEnv]
      };
    };
  }
  
  // Synthesize lead sound
  function createLeadSynth(attack = 0.05, decay = 0.2, sustain = 0.6, release = 0.4) {
    return function(time, note, duration, velocity) {
      const osc = audioCtx.createOscillator();
      const gainEnv = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      
      // Convert MIDI note to frequency
      const freq = 440 * Math.pow(2, (note - 69) / 12);
      
      // Configure oscillator
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      
      // Configure filter
      filter.type = 'lowpass';
      filter.frequency.value = 3000;
      filter.Q.value = 3;
      
      // Configure envelope
      gainEnv.gain.value = 0;
      
      // ADSR envelope
      const now = audioCtx.currentTime;
      gainEnv.gain.setValueAtTime(0, now + time);
      gainEnv.gain.linearRampToValueAtTime(velocity, now + time + attack);
      gainEnv.gain.linearRampToValueAtTime(velocity * sustain, now + time + attack + decay);
      gainEnv.gain.linearRampToValueAtTime(0, now + time + duration + release);
      
      // Filter envelope for brightness
      filter.frequency.setValueAtTime(1000, now + time);
      filter.frequency.linearRampToValueAtTime(3000, now + time + attack);
      filter.frequency.linearRampToValueAtTime(2000, now + time + attack + decay + duration);
      
      // Connect everything
      osc.connect(filter);
      filter.connect(gainEnv);
      gainEnv.connect(audioNodes.gain);
      
      // Start and stop
      osc.start(now + time);
      osc.stop(now + time + duration + release);
      
      return {
        oscillators: [osc],
        gains: [gainEnv]
      };
    };
  }
  
  // Synthesize pluck sound
  function createPluckSynth(attack = 0.005, decay = 0.1, sustain = 0.3, release = 0.2) {
    return function(time, note, duration, velocity, options = {}) {
      const osc = audioCtx.createOscillator();
      const gainEnv = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      
      // Convert MIDI note to frequency
      const freq = 440 * Math.pow(2, (note - 69) / 12);
      
      // Configure oscillator
      osc.type = 'triangle';
      osc.frequency.value = freq;
      
      // Configure filter
      filter.type = 'lowpass';
      filter.frequency.value = 5000;
      filter.Q.value = 2;
      
      // Configure envelope
      gainEnv.gain.value = 0;
      
      // ADSR envelope
      const now = audioCtx.currentTime;
      
      if (options.reverse) {
        // Reverse effect (slow attack, sharp release)
        gainEnv.gain.setValueAtTime(0, now + time);
        gainEnv.gain.linearRampToValueAtTime(velocity, now + time + duration * 0.8);
        gainEnv.gain.linearRampToValueAtTime(0, now + time + duration);
      } else {
        // Normal pluck (sharp attack, exponential decay)
        gainEnv.gain.setValueAtTime(0, now + time);
        gainEnv.gain.linearRampToValueAtTime(velocity, now + time + attack);
        gainEnv.gain.linearRampToValueAtTime(velocity * sustain, now + time + attack + decay);
        gainEnv.gain.linearRampToValueAtTime(0, now + time + duration + release);
      }
      
      // Filter envelope for brightness
      filter.frequency.setValueAtTime(8000, now + time);
      filter.frequency.exponentialRampToValueAtTime(1000, now + time + duration);
      
      // Connect everything
      osc.connect(filter);
      filter.connect(gainEnv);
      gainEnv.connect(audioNodes.gain);
      
      // Start and stop
      osc.start(now + time);
      osc.stop(now + time + duration + release);
      
      return {
        oscillators: [osc],
        gains: [gainEnv]
      };
    };
  }
  
  // Synthesize percussion sounds
  function createPercussionSynth() {
    return function(time, note, duration, velocity) {
      const now = audioCtx.currentTime;
      
      // Different treatment based on note number (36=kick, 38=snare, 42=hi-hat, 49=crash)
      if (note === 36) { // Kick
        // Kick drum - sine with pitch envelope
        const osc = audioCtx.createOscillator();
        const gainEnv = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now + time);
        osc.frequency.exponentialRampToValueAtTime(40, now + time + 0.1);
        
        gainEnv.gain.setValueAtTime(0, now + time);
        gainEnv.gain.linearRampToValueAtTime(velocity, now + time + 0.005);
        gainEnv.gain.exponentialRampToValueAtTime(0.001, now + time + 0.4);
        
        osc.connect(gainEnv);
        gainEnv.connect(audioNodes.gain);
        
        osc.start(now + time);
        osc.stop(now + time + 0.4);
        
        return {
          oscillators: [osc],
          gains: [gainEnv]
        };
      } 
      else if (note === 38) { // Snare
        // Snare - noise + tone
        const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0, now + time);
        noiseGain.gain.linearRampToValueAtTime(velocity * 0.8, now + time + 0.005);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + time + 0.2);
        
        // Tone component
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = 180;
        
        const oscGain = audioCtx.createGain();
        oscGain.gain.setValueAtTime(0, now + time);
        oscGain.gain.linearRampToValueAtTime(velocity * 0.5, now + time + 0.005);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + time + 0.1);
        
        // Filter for noise
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1000;
        
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioNodes.gain);
        
        osc.connect(oscGain);
        oscGain.connect(audioNodes.gain);
        
        noise.start(now + time);
        osc.start(now + time);
        osc.stop(now + time + 0.2);
        
        return {
          oscillators: [osc, noise],
          gains: [noiseGain, oscGain]
        };
      }
      else if (note === 42) { // Hi-hat
        // Hi-hat - filtered noise, short duration
        const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0, now + time);
        noiseGain.gain.linearRampToValueAtTime(velocity * 0.7, now + time + 0.001);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + time + 0.08);
        
        // Filter for noise
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 7000;
        
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioNodes.gain);
        
        noise.start(now + time);
        
        return {
          oscillators: [noise],
          gains: [noiseGain]
        };
      }
      else if (note === 49) { // Crash
        // Crash cymbal - filtered noise with longer decay
        const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.5, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0, now + time);
        noiseGain.gain.linearRampToValueAtTime(velocity * 0.8, now + time + 0.005);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + time + 1.5);
        
        // Filter for noise
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 5000;
        
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioNodes.gain);
        
        noise.start(now + time);
        
        return {
          oscillators: [noise],
          gains: [noiseGain]
        };
      }
      else {
        // Default percussion - simple sine tone
        const osc = audioCtx.createOscillator();
        const gainEnv = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = 440 * Math.pow(2, (note - 69) / 12);
        
        gainEnv.gain.setValueAtTime(0, now + time);
        gainEnv.gain.linearRampToValueAtTime(velocity, now + time + 0.005);
        gainEnv.gain.exponentialRampToValueAtTime(0.001, now + time + 0.1);
        
        osc.connect(gainEnv);
        gainEnv.connect(audioNodes.gain);
        
        osc.start(now + time);
        osc.stop(now + time + 0.1);
        
        return {
          oscillators: [osc],
          gains: [gainEnv]
        };
      }
    };
  }
  
  // Create full song buffer
  function createSongBuffer(songData) {
    try {
      const totalDuration = songData.duration;
      const sampleRate = audioCtx.sampleRate;
      const bufferSize = Math.ceil(sampleRate * totalDuration);
      const buffer = audioCtx.createBuffer(2, bufferSize, sampleRate); // Stereo
      const leftChannel = buffer.getChannelData(0);
      const rightChannel = buffer.getChannelData(1);
      
      // Clear buffer
      for (let i = 0; i < bufferSize; i++) {
        leftChannel[i] = 0;
        rightChannel[i] = 0;
      }
      
      // Temporary rendering context
      const offlineCtx = new OfflineAudioContext(2, bufferSize, sampleRate);
      
      // Create gain node for master output
      const masterGain = offlineCtx.createGain();
      masterGain.gain.value = 0.8; // Prevent clipping
      masterGain.connect(offlineCtx.destination);
      
      // Initialize instruments in offline context
      const instruments = {
        bass: {
          synth: createBassSynth(0.01, 0.2, 0.3, 0.3),
          gain: offlineCtx.createGain()
        },
        pads: {
          synth: createPadSynth(0.5, 0.5, 0.8, 1.0),
          gain: offlineCtx.createGain()
        },
        lead: {
          synth: createLeadSynth(0.05, 0.2, 0.6, 0.4),
          gain: offlineCtx.createGain()
        },
        pluck: {
          synth: createPluckSynth(0.005, 0.1, 0.3, 0.2),
          gain: offlineCtx.createGain()
        },
        percussion: {
          synth: createPercussionSynth(),
          gain: offlineCtx.createGain()
        }
      };
      
      // Set instrument levels
      instruments.bass.gain.gain.value = 0.8;
      instruments.pads.gain.gain.value = 0.6;
      instruments.lead.gain.gain.value = 0.7;
      instruments.pluck.gain.gain.value = 0.5;
      instruments.percussion.gain.gain.value = 0.9;
      
      // Connect instrument gains to master
      Object.values(instruments).forEach(inst => {
        inst.gain.connect(masterGain);
      });
      
      // Process all events across all sections
      let allEvents = [];
      
      // Safely process sections
      if (Array.isArray(songData.sections)) {
        songData.sections.forEach(section => {
          if (section && Array.isArray(section.events)) {
            section.events.forEach(event => {
              if (event && typeof event.time === 'number') {
                allEvents.push({
                  ...event,
                  time: section.startTime + event.time
                });
              }
            });
          }
        });
      }
      
      // Sort events by time
      allEvents.sort((a, b) => a.time - b.time);
      
      // Schedule all events
      allEvents.forEach(event => {
        if (!instruments[event.instrument]) return;
        
        const inst = instruments[event.instrument];
        
        // Use the original AudioContext's time as reference for the synth
        const synth = inst.synth(
          event.time, 
          event.note, 
          event.duration, 
          event.velocity, 
          { reverse: event.reverse }
        );
        
        if (synth && synth.gains) {
          synth.gains.forEach(gain => gain.connect(inst.gain));
        }
      });
      
      // Render the audio
      return offlineCtx.startRendering().then(renderedBuffer => {
        // Copy the rendered buffer to our output buffer
        const renderedLeft = renderedBuffer.getChannelData(0);
        const renderedRight = renderedBuffer.getChannelData(1);
        
        for (let i = 0; i < bufferSize; i++) {
          leftChannel[i] = renderedLeft[i];
          rightChannel[i] = renderedRight[i];
        }
        
        return buffer;
      });
    } catch (err) {
      log(`Error in createSongBuffer: ${err.message}`);
      // Create a silent buffer
      const emptyBuffer = audioCtx.createBuffer(2, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      return Promise.resolve(emptyBuffer);
    }
  }
  
  // Generate music function
  function generate() {
    if (isGenerating) return;
    
    isGenerating = true;
    loadingEl.classList.add('active');
    log('Generating quantum music...');
    genBtn.disabled = true;
    playBtn.disabled = true;
    stopBtn.disabled = true;
    
    // Get parameters
    const seed = seedEl.value || 'Quantum Harmonic Oscillation';
    const dimensions = parseInt(dimensionsSlider.value);
    const twist = parseFloat(twistSlider.value);
    const quantumStates = parseInt(quantumSlider.value);
    const evolutionSteps = parseInt(evolutionSlider.value);
    const complexity = parseInt(complexitySlider.value);
    const duration = parseInt(durationSlider.value);
    
    // Generate song structure
    loadingText.textContent = "Creating quantum music structure...";
    
    // Use setTimeout to allow UI to update
    setTimeout(() => {
      try {
        log('Generating song structure...');
        songData = generateSongStructure(seed, duration, complexity);
        
        // Log what we generated
        log(`Generated ${songData.duration.toFixed(2)}s song at ${songData.bpm} BPM`);
        
        // Count total events
        let totalEvents = 0;
        songData.sections.forEach(section => {
          if (Array.isArray(section.events)) {
            totalEvents += section.events.length;
          }
        });
        log(`Generated ${totalEvents} musical events across ${songData.sections.length} sections`);
        
        // Generate audio buffer (this is intensive)
        loadingText.textContent = "Synthesizing audio...";
        
        setTimeout(() => {
          createSongBuffer(songData).then(buffer => {
            audioBuffer = buffer;
            
            loadingEl.classList.remove('active');
            isGenerating = false;
            genBtn.disabled = false;
            playBtn.disabled = false;
            
            log('Quantum music generation complete!');
            log('Click Play to hear your quantum song');
          }).catch(err => {
            log(`Error rendering audio: ${err.message}`);
            loadingEl.classList.remove('active');
            isGenerating = false;
            genBtn.disabled = false;
          });
        }, 100);
      } catch (err) {
        log(`Generation error: ${err.message}`);
        console.error(err);
        loadingEl.classList.remove('active');
        isGenerating = false;
        genBtn.disabled = false;
      }
    }, 100);
    
    // Try to wake up audio context
    if (audioCtx && audioCtx.state !== "running") {
      audioCtx.resume().then(() => {
        log('Audio context activated');
      }).catch(err => {
        log('Audio permission needed: click Play');
      });
    }
  }
  
  // Play function
  function play() {
    if (!audioBuffer) {
      log('Please generate music first');
      return;
    }
    
    if (isPlaying) {
      stop();
    }
    
    // Ensure audio context is running (needs user gesture)
    if (audioCtx.state !== 'running') {
      log('Attempting to resume audio context...');
      audioCtx.resume().then(() => {
        log('Audio context resumed successfully!');
        startPlayback();
      }).catch(err => {
        log(`Could not start audio: ${err.message}`);
        playBtn.disabled = false;
      });
    } else {
      startPlayback();
    }
  }
  
  function startPlayback() {
    try {
      // Create nodes
      audioNodes.source = audioCtx.createBufferSource();
      audioNodes.gain = audioCtx.createGain();
      
      // Configure
      audioNodes.source.buffer = audioBuffer;
      audioNodes.gain.gain.value = 0.7;
      
      // Connect
      audioNodes.source.connect(audioNodes.gain);
      audioNodes.gain.connect(audioCtx.destination);
      
      // Start playback
      audioNodes.source.start();
      startTime = audioCtx.currentTime;
      isPlaying = true;
      songData.currentTime = 0;
      
      // Update UI
      playBtn.disabled = true;
      stopBtn.disabled = false;
      log('Playback started');
      
      // Update progress
      updateProgress();
      
      // Handle completion
      audioNodes.source.onended = () => {
        isPlaying = false;
        audioNodes.source = null;
        audioNodes.gain = null;
        
        // Update UI
        playBtn.disabled = false;
        stopBtn.disabled = true;
        progressBar.style.width = '0%';
        log('Playback completed');
      };
    } catch (err) {
      log(`Playback error: ${err.message}`);
      playBtn.disabled = false;
      stopBtn.disabled = true;
    }
  }
  
  // Stop function
  function stop() {
    if (isPlaying && audioNodes.source) {
      audioNodes.source.stop();
      isPlaying = false;
      audioNodes.source = null;
      audioNodes.gain = null;
      
      // Update UI
      playBtn.disabled = false;
      stopBtn.disabled = true;
      progressBar.style.width = '0%';
      log('Playback stopped');
    }
  }
  
  // Update progress bar and current time
  function updateProgress() {
    if (!isPlaying || !audioNodes.source || !audioBuffer) return;
    
    const elapsed = audioCtx.currentTime - startTime;
    const duration = audioBuffer.duration;
    const progress = Math.min(elapsed / duration, 1);
    songData.currentTime = elapsed;
    
    progressBar.style.width = `${progress * 100}%`;
    
    // Find current section
    if (songData.sections && Array.isArray(songData.sections)) {
      let currentSection = null;
      for (let i = 0; i < songData.sections.length; i++) {
        const section = songData.sections[i];
        if (section && elapsed >= section.startTime && 
            (i === songData.sections.length - 1 || elapsed < songData.sections[i + 1].startTime)) {
          currentSection = section;
          break;
        }
      }
      
      if (currentSection && !currentSection.announced) {
        log(`Now playing: ${currentSection.type}`);
        
        // Mark as announced
        currentSection.announced = true;
        
        // Reset other sections
        songData.sections.forEach(s => {
          if (s !== currentSection) s.announced = false;
        });
      }
    }
    
    if (progress < 1) {
      requestAnimationFrame(updateProgress);
    }
  }
  
  // Visualization
  function visualize() {
    // Clear with fade effect
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if (isPlaying && audioBuffer && songData) {
      const elapsed = songData.currentTime;
      const totalDuration = audioBuffer.duration;
      
      // Get current section
      let currentSection = null;
      if (Array.isArray(songData.sections)) {
        for (let i = 0; i < songData.sections.length; i++) {
          const section = songData.sections[i];
          if (section && elapsed >= section.startTime && 
              (i === songData.sections.length - 1 || elapsed < songData.sections[i + 1].startTime)) {
            currentSection = section;
            break;
          }
        }
      }
      
      // Find active notes at this timestamp
      const activeNotes = [];
      
      if (currentSection && Array.isArray(currentSection.events)) {
        // Local time within section
        const sectionTime = elapsed - currentSection.startTime;
        
        // Find events that are currently active
        currentSection.events.forEach(event => {
          if (event && typeof event.time === 'number' && 
              sectionTime >= event.time && sectionTime <= event.time + event.duration) {
            activeNotes.push({
              ...event,
              progress: (sectionTime - event.time) / event.duration
            });
          }
        });
      }
      
      // Draw based on section type
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxRadius = Math.min(canvas.width, canvas.height) * 0.4;
      
      // Draw section indicator
      if (currentSection) {
        ctx.fillStyle = 'rgba(0, 255, 200, 0.2)';
        ctx.textAlign = 'center';
        ctx.font = 'bold 24px monospace';
        ctx.fillText(currentSection.type.toUpperCase(), centerX, 40);
      }
      
      // Draw progress ring
      const progress = elapsed / totalDuration;
      ctx.beginPath();
      ctx.arc(centerX, centerY, maxRadius * 1.1, 0, progress * TAU);
      ctx.strokeStyle = 'rgba(0, 255, 200, 0.5)';
      ctx.lineWidth = 5;
      ctx.stroke();
      
      // Draw active notes
      activeNotes.forEach(note => {
        // Parameters based on note properties
        const noteAngle = (note.note / 127) * TAU;
        const noteRadius = maxRadius * (0.2 + 0.7 * note.velocity);
        const x = centerX + Math.cos(noteAngle) * noteRadius;
        const y = centerY + Math.sin(noteAngle) * noteRadius;
        
        // Calculate color based on instrument
        let hue = 0;
        let size = 5 + note.velocity * 20;
        
        switch(note.instrument) {
          case 'bass':
            hue = 220; // Blue
            size = 10 + note.velocity * 15;
            break;
          case 'pads':
            hue = 180; // Cyan
            size = 8 + note.velocity * 12;
            break;
          case 'lead':
            hue = 120; // Green
            size = 6 + note.velocity * 20;
            break;
          case 'pluck':
            hue = 300; // Magenta
            size = 4 + note.velocity * 12;
            break;
          case 'percussion':
            hue = 60; // Yellow
            size = 5 + note.velocity * 10;
            break;
        }
        
        // Draw note
        ctx.beginPath();
        ctx.arc(x, y, size, 0, TAU);
        ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.7 * note.velocity})`;
        ctx.fill();
        
        // Draw ripple effect
        const rippleSize = size * (1 + note.progress * 2);
        ctx.beginPath();
        ctx.arc(x, y, rippleSize, 0, TAU);
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${0.5 * (1 - note.progress)})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Draw line to center
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${0.2 * note.velocity})`;
        ctx.lineWidth = 1 + 3 * note.velocity;
        ctx.stroke();
      });
      
      // Draw central orb
      ctx.beginPath();
      ctx.arc(centerX, centerY, 10 + 5 * Math.sin(elapsed * 3), 0, TAU);
      const glowIntensity = 0.3 + 0.2 * Math.sin(elapsed * 2);
      ctx.fillStyle = `rgba(0, 255, 200, ${glowIntensity})`;
      ctx.fill();
      
      // Central glow effect
      const gradient = ctx.createRadialGradient(
        centerX, centerY, 5,
        centerX, centerY, 50
      );
      gradient.addColorStop(0, `rgba(0, 255, 200, ${glowIntensity})`);
      gradient.addColorStop(1, 'rgba(0, 255, 200, 0)');
      
      ctx.beginPath();
      ctx.arc(centerX, centerY, 50, 0, TAU);
      ctx.fillStyle = gradient;
      ctx.fill();
    } else {
      // Static visualization when not playing
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const dimensions = parseInt(dimensionsSlider.value);
      
      // Draw static particles
      for (let i = 0; i < dimensions; i++) {
        const angle = (i / dimensions) * TAU;
        const radius = Math.min(canvas.width, canvas.height) * 0.3;
        
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius;
        
        const timeOffset = Date.now() / 1000;
        const pulseSize = 3 + Math.sin(timeOffset + i * 0.2) * 2;
        const hue = (i / dimensions * 360 + timeOffset * 20) % 360;
        
        ctx.beginPath();
        ctx.arc(x, y, pulseSize, 0, TAU);
        ctx.fillStyle = `hsla(${hue}, 70%, 50%, 0.6)`;
        ctx.fill();
        
        // Connection lines
        if (i % 3 === 0) {
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(x, y);
          ctx.strokeStyle = `hsla(${hue}, 70%, 50%, 0.1)`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      
      // Central orb pulse
      const timeOffset = Date.now() / 1000;
      const pulseSize = 10 + Math.sin(timeOffset * 2) * 5;
      
      ctx.beginPath();
      ctx.arc(centerX, centerY, pulseSize, 0, TAU);
      ctx.fillStyle = `rgba(0, 255, 200, ${0.3 + 0.1 * Math.sin(timeOffset * 3)})`;
      ctx.fill();
    }
    
    // Continue animation
    requestAnimationFrame(visualize);
  }
  
  // Set up button events
  genBtn.addEventListener('click', () => {
    // Try to resume audio context on user gesture
    if (audioCtx && audioCtx.state !== "running") {
      audioCtx.resume().catch(e => {
        log('Audio will need permission when you play');
      });
    }
    generate();
  });
  
  playBtn.addEventListener('click', play);
  stopBtn.addEventListener('click', stop);
  
  // Initialize
  log('Quantum Mobius Music Generator initialized');
  log('Enter a seed phrase and click Generate to begin');
  
  // Start visualization
  visualize();
})();
</script>
