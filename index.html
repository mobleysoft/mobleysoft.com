<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobleysoft.com</title>
    <style>
        body {
            background-color: #111111;
            color: #00FFCC;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1 {
            color: #00FFCC;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .glassmorphism {
            background-color: rgba(0, 0, 0, 0.8);
            animation: glassmorphism 10s infinite;
        }
        @keyframes glassmorphism {
            from {
                background-color: rgba(0, 0, 0, 0.8);
            }
            to {
                background-color: rgba(0, 0, 0, 0);
            }
        }
    </style>
</head>
<body>
    <h1>mobleysoft.com</h1>
    <div class="glassmorphism"></div>
</body>
</html>
