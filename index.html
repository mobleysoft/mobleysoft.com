<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobleysoft.com</title>
    <style>
        body {
            background-color: #111111;
            color: #00FFCC;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            padding: 10px;
            margin: 0;
            background-image: url("glassmorphism.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            animation: glassmorphism 1s infinite;
        }

        .glassmorphism {
            animation-delay: 0s;
        }

        @keyframes glassmorphism {
            0% {
                opacity: 0;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <h1>mobleysoft.com</h1>
    <p>Autonomous AI-driven platform revolutionizing the mobleysoft space.</p>
    <p>Target valuation: $100M.</p>
</body>
</html>
