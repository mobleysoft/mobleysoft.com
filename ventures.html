        :root {
            --void: #02060a;
            --ink: #071015;
            --panel: rgba(5, 12, 17, 0.9);
            --bone: #f4efe4;
            --muted: #9ba7aa;
            --dim: #59676a;
            --gold: #d9a441;
            --gold-bright: #f3c66c;
            --cyan: #5eead4;
            --line: rgba(244, 239, 228, 0.14);
            --soft-line: rgba(244, 239, 228, 0.07);
            --display: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
            --sans: "Avenir Next Condensed", "Avenir Next", "Helvetica Neue", sans-serif;
            --mono: "SFMono-Regular", "Cascadia Code", "Liberation Mono", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            min-height: 100%;
            background: var(--void);
            color-scheme: dark;
        }

        body {
            min-height: 100vh;
            background: var(--void);
            color: var(--bone);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        .void-grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.13;
            background-image:
                repeating-radial-gradient(circle at 10% 20%, transparent 0 1px, rgba(255,255,255,0.08) 1px 2px),
                linear-gradient(110deg, transparent 30%, rgba(217,164,65,0.04), transparent 70%);
            background-size: 5px 5px, 100% 100%;
            mix-blend-mode: soft-light;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            padding-bottom: 40px;
            border-bottom: 2px solid var(--line);
        }

        .status-line {
            font-size: 10px;
            font-family: var(--mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--dim);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 56px;
            font-family: var(--display);
            font-weight: 400;
            margin: 20px 0;
            color: var(--bone);
            line-height: 1.2;
        }

        .tagline {
            font-size: 18px;
            color: var(--muted);
            margin-top: 20px;
            font-family: var(--display);
            font-style: italic;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        .stat {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 20px;
            border-radius: 4px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 600;
            color: var(--gold-bright);
            font-family: var(--mono);
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--dim);
            margin-top: 8px;
        }

        .search-section {
            margin-bottom: 50px;
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--bone);
            font-family: var(--mono);
            font-size: 14px;
            border-radius: 4px;
            transition: border-color 180ms ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--gold);
        }

        .ventures-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }

        .venture {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 24px;
            border-radius: 4px;
            transition: all 180ms ease;
            cursor: default;
        }

        .venture:hover {
            border-color: var(--gold);
            background: rgba(5, 12, 17, 1);
        }

        .venture-name {
            font-size: 16px;
            font-family: var(--mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gold-bright);
            margin-bottom: 12px;
            word-break: break-all;
        }

        .venture-spec {
            font-size: 14px;
            line-height: 1.8;
            color: var(--bone);
        }

        .venture.hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 2px solid var(--line);
            color: var(--dim);
            font-size: 11px;
            font-family: var(--mono);
        }

        @media (max-width: 768px) {
            .ventures-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 36px;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>

        function renderVentures(filter = "") {
            const grid = document.getElementById("ventures-grid");
            grid.innerHTML = "";

            const filtered = ventures.filter(v =>
                v.name.toLowerCase().includes(filter.toLowerCase()) ||
                v.spec.toLowerCase().includes(filter.toLowerCase())
            );

            filtered.forEach(venture => {
                const div = document.createElement("div");
                div.className = "venture";
                div.innerHTML = `
                    <div class="venture-name">${venture.name}</div>
                    <div class="venture-spec">${venture.spec}</div>
                `;
                grid.appendChild(div);
            });

            if (filtered.length === 0) {
                const div = document.createElement("div");
                div.style.gridColumn = "1 / -1";
                div.style.textAlign = "center";
                div.style.padding = "40px";
                div.style.color = "var(--muted)";
                div.innerHTML = "No ventures found matching that search.";
                grid.appendChild(div);
            }
        }
